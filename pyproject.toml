[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lysen"
version = "1.0.0"
description = "Lysen: Enterprise-grade C2PA audio provenance and cryptographic authenticity engine"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Lysen Audio Provenance Team", email = "engineering@lysen.audio"}
]
requires-python = ">=3.10"
keywords = [
    "c2pa",
    "audio-provenance",
    "cryptography",
    "ed25519",
    "sha3",
    "blake3",
    "merkle-tree",
    "watermarking",
    "authenticity",
    "metadata"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Other Audience",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Security :: Cryptography",
    "Operating System :: OS Independent"
]
dependencies = [
    "cryptography>=41.0.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "blake3>=0.3.0",
    "reportlab>=4.0.0",
    "jsonschema>=4.20.0",
    "pyacoustid>=1.3.0",
    "flask>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "flake8>=6.0.0"
]

[project.urls]
Homepage = "https://github.com/lysen-audio/audio_provenance"
Documentation = "https://github.com/lysen-audio/audio_provenance/tree/main/docs"
Repository = "https://github.com/lysen-audio/audio_provenance"
Issues = "https://github.com/lysen-audio/audio_provenance/issues"
Changelog = "https://github.com/lysen-audio/audio_provenance/blob/main/CHANGELOG.md"

[project.scripts]
lysen = "cli:main"
audio-provenance = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "security*", "audit*", "reporting*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
