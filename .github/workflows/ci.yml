name: Lysen Audio Provenance CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  python-test-suite:
    name: Python Test Suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Audio Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libchromaprint-tools ffmpeg libsndfile1

      - name: Install Python Package & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Build Wheel & Source Distribution
        run: |
          python -m build

      - name: Auto-Sign Audio Assets (Main Branch Only)
        if: github.ref == 'refs/heads/main' && env.LYSEN_PRIVATE_KEY != ''
        env:
          LYSEN_PRIVATE_KEY: ${{ secrets.LYSEN_PRIVATE_KEY }}
        run: |
          python -m core.github_action ./assets/ "$LYSEN_PRIVATE_KEY"

  flutter-test-suite:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Run Flutter Tests
        run: flutter test
